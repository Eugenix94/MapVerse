[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/api/overpass-primary"
  to = "https://overpass-api.de/api/interpreter"
  status = 200
  force = true
  headers = { User-Agent = "MapVerse/1.0 (https://mapverse0.netlify.app)" }

[[redirects]]
  from = "/api/overpass-lz4"
  to = "https://lz4.overpass-api.de/api/interpreter"
  status = 200
  force = true
  headers = { User-Agent = "MapVerse/1.0 (https://mapverse0.netlify.app)" }

[[redirects]]
  from = "/api/overpass-z"
  to = "https://z.overpass-api.de/api/interpreter"
  status = 200
  force = true
  headers = { User-Agent = "MapVerse/1.0 (https://mapverse0.netlify.app)" }

[[redirects]]
  from = "/api/overpass-kumi"
  to = "https://overpass.kumi.systems/api/interpreter"
  status = 200
  force = true
  headers = { User-Agent = "MapVerse/1.0 (https://mapverse0.netlify.app)" }

[[redirects]]
  from = "/api/elevation"
  to = "https://api.opentopodata.org/v1/srtm30m"
  status = 200
  force = true
  headers = { User-Agent = "MapVerse/1.0 (https://mapverse0.netlify.app)" }

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
